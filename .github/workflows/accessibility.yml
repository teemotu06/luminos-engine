name: Accessibility

on:
  push:
  pull_request:

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build static assets
        run: python scripts/build_static.py --check
      - name: Start app
        env:
          DATABASE_URL: sqlite:////tmp/luminos_engine_a11y.db
          LUMINOS_AUTH_REQUIRED: "false"
          LUMINOS_ADMIN_SECRET: ci-admin-secret
          LUMINOS_ENFORCE_ADMIN_SECRET: "false"
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/luminos-uvicorn.pid
          sleep 5
      - name: Run axe
        run: npx -y @axe-core/cli http://127.0.0.1:8000/lesson/ http://127.0.0.1:8000/classes/
      - name: Stop app
        if: always()
        run: kill "$(cat /tmp/luminos-uvicorn.pid)"
