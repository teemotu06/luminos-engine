name: Nightly Backup

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run backup
        env:
          DATABASE_URL: ${{ secrets.LUMINOS_BACKUP_DATABASE_URL }}
          BACKUP_DIR: backups
        run: bash scripts/backup_postgres.sh
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: luminos-postgres-backup
          path: backups/*.sql.gz
