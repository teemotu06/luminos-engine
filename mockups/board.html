<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminos Board — Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #070504;
      --bg-2:         #0e0a07;
      --surface:      rgba(255,252,248,0.04);
      --border:       rgba(255,255,255,0.06);
      --text:         #f0e8dd;
      --text-dim:     rgba(240,232,221,0.38);
      --accent:       #c4783e;
      --accent-dim:   rgba(196,120,62,0.18);
      --secure:       #4ade80;
      --shaky:        #fbbf24;
      --missed:       #f87171;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    /* ── Layout ── */
    .board {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 56px 1fr 80px;
      position: relative;
    }

    /* ── Top bar ── */
    .board__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(7,5,4,0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: relative;
      z-index: 2;
    }

    .board__brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .board__logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.9;
    }

    .board__sep {
      width: 1px;
      height: 14px;
      background: var(--border);
    }

    .board__lesson {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.01em;
    }

    .board__progress {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .board__slide-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .board__dots {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .board__dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border);
      transition: all 0.3s ease;
    }

    .board__dot--active {
      background: var(--accent);
      width: 16px;
      border-radius: 3px;
    }

    .board__dot--done {
      background: rgba(196,120,62,0.4);
    }

    /* ── Main content stage ── */
    .board__stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 48px 64px;
      overflow: hidden;
    }

    /* Spotlight effect behind the content */
    .board__stage::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 60vw;
      height: 60vh;
      background: radial-gradient(ellipse at center,
        rgba(196,120,62,0.07) 0%,
        rgba(196,120,62,0.02) 40%,
        transparent 70%);
      pointer-events: none;
    }

    .board__phase-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0.7;
      margin-bottom: 24px;
      position: relative;
    }

    .board__content {
      position: relative;
      text-align: center;
      max-width: 90vw;
    }

    /* The main slide text — word/sentence */
    .board__word {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(72px, 16vw, 220px);
      font-weight: 500;
      line-height: 1;
      color: var(--text);
      letter-spacing: -0.01em;
      position: relative;
    }

    /* Subtle text glow */
    .board__word::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      color: var(--accent);
      filter: blur(32px);
      opacity: 0.15;
      pointer-events: none;
    }

    /* ── Student callout ── */
    .board__student {
      position: absolute;
      left: 50%;
      bottom: 96px;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      animation: studentIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes studentIn {
      from { opacity: 0; transform: translateX(-50%) translateY(16px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .board__student-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .board__student-name {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
    }

    .board__student-queue {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-dim);
      margin-top: 2px;
    }

    /* ── Timer bar ── */
    .board__timer {
      position: absolute;
      bottom: 80px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--border);
    }

    .board__timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, rgba(196,120,62,0.4) 100%);
      width: 65%;
      animation: timerDrain 8s linear forwards;
    }

    @keyframes timerDrain {
      from { width: 65%; }
      to   { width: 0%; }
    }

    /* ── Bottom command bar ── */
    .board__bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      background: rgba(7,5,4,0.9);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      position: relative;
      z-index: 2;
    }

    .board__state {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .board__state-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid rgba(196,120,62,0.2);
    }

    .board__instruction {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-dim);
      font-style: italic;
      font-family: "Cormorant Garamond", serif;
    }

    .board__queue-count {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    /* ── Demo switcher (not part of final product) ── */
    .demo-switcher {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 99;
      display: flex;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      padding: 6px;
      border-radius: 10px;
      backdrop-filter: blur(8px);
    }

    .demo-btn {
      font-size: 10px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.05em;
    }

    .demo-btn:hover, .demo-btn.active {
      background: rgba(255,255,255,0.12);
      color: #fff;
    }

    /* ── States ── */
    .state-deliver .board__word { font-size: clamp(100px, 20vw, 280px); }

    .state-sentence .board__word {
      font-size: clamp(36px, 6vw, 80px);
      line-height: 1.3;
      font-weight: 400;
      font-style: italic;
      max-width: 80vw;
    }

    .state-complete .board__stage { background: radial-gradient(ellipse at 50% 60%, rgba(74,222,128,0.06) 0%, transparent 60%); }

    .stats-grid {
      display: none;
      gap: 32px;
      margin-top: 16px;
    }

    .state-complete .stats-grid { display: flex; }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .stat__num {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 600;
      line-height: 1;
    }

    .stat__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    .stat--secure .stat__num { color: var(--secure); }
    .stat--shaky  .stat__num { color: var(--shaky);  }
    .stat--missed .stat__num { color: var(--missed); }

    .state-complete .board__word { display: none; }
    .state-complete .board__phase-label { color: var(--secure); }
  </style>
</head>
<body>

<!-- Demo controls — not part of final product -->
<div class="demo-switcher">
  <button class="demo-btn active" onclick="setDemo('deliver')">Word</button>
  <button class="demo-btn" onclick="setDemo('sentence')">Sentence</button>
  <button class="demo-btn" onclick="setDemo('observe')">Observe</button>
  <button class="demo-btn" onclick="setDemo('complete')">Complete</button>
</div>

<div class="board state-deliver" id="board">

  <!-- Top bar -->
  <header class="board__top">
    <div class="board__brand">
      <span class="board__logo">Luminos</span>
      <div class="board__sep"></div>
      <span class="board__lesson" id="lesson-label">Blending CVC Words</span>
    </div>
    <div class="board__progress">
      <span class="board__slide-label" id="slide-label">Slide 2 / 8</span>
      <div class="board__dots" id="dots">
        <div class="board__dot board__dot--done"></div>
        <div class="board__dot board__dot--active"></div>
        <div class="board__dot"></div>
        <div class="board__dot"></div>
        <div class="board__dot"></div>
        <div class="board__dot"></div>
        <div class="board__dot"></div>
        <div class="board__dot"></div>
      </div>
    </div>
  </header>

  <!-- Main stage -->
  <main class="board__stage">
    <div class="board__phase-label" id="phase-label">Oral Check</div>

    <div class="board__content">
      <div class="board__word" data-text="cat" id="content">cat</div>

      <!-- Complete state stats (hidden by default) -->
      <div class="stats-grid" id="stats">
        <div class="stat stat--secure">
          <span class="stat__num">8</span>
          <span class="stat__label">Secure</span>
        </div>
        <div class="stat stat--shaky">
          <span class="stat__num">3</span>
          <span class="stat__label">Mixed</span>
        </div>
        <div class="stat stat--missed">
          <span class="stat__num">1</span>
          <span class="stat__label">Revisit</span>
        </div>
      </div>
    </div>

    <!-- Student callout -->
    <div class="board__student" id="student-callout">
      <span class="board__student-label">Now with</span>
      <span class="board__student-name" id="student-name">Emma Wilson</span>
      <span class="board__student-queue" id="queue-label">4 remaining</span>
    </div>
  </main>

  <!-- Timer bar -->
  <div class="board__timer" id="timer">
    <div class="board__timer-fill" id="timer-fill"></div>
  </div>

  <!-- Bottom command bar -->
  <footer class="board__bar">
    <div class="board__state">
      <span class="board__state-pill" id="state-pill">Oral Check</span>
      <span class="board__instruction" id="instruction">Listen and repeat</span>
    </div>
    <span class="board__queue-count" id="queue-count">Student 2 of 12</span>
  </footer>

</div>

<script>
  const demos = {
    deliver: {
      state: 'state-deliver',
      phase: 'Deliver',
      pill: 'Delivering',
      instruction: 'Say it with me',
      content: 'cat',
      slideLabel: 'Slide 2 / 8',
      showStudent: false,
      showTimer: false,
      queueCount: '',
    },
    sentence: {
      state: 'state-sentence',
      phase: 'Deliver',
      pill: 'Read Aloud',
      instruction: 'Read together',
      content: 'The cat sat on the mat.',
      slideLabel: 'Slide 4 / 8',
      showStudent: false,
      showTimer: false,
      queueCount: '',
    },
    observe: {
      state: 'state-deliver',
      phase: 'Oral Check',
      pill: 'Oral Check',
      instruction: 'Listen and repeat',
      content: 'cat',
      slideLabel: 'Slide 2 / 8',
      showStudent: true,
      showTimer: true,
      queueCount: 'Student 2 of 12',
    },
    complete: {
      state: 'state-complete',
      phase: 'Complete',
      pill: 'Complete',
      instruction: 'Well done, everyone',
      content: 'Blending CVC Words',
      slideLabel: 'Slide 8 / 8',
      showStudent: false,
      showTimer: false,
      queueCount: '',
    },
  };

  const stateClasses = ['state-deliver','state-sentence','state-observe','state-complete'];

  function setDemo(key) {
    const d = demos[key];
    const board = document.getElementById('board');
    board.className = 'board ' + d.state;

    document.getElementById('phase-label').textContent = d.phase;
    document.getElementById('state-pill').textContent = d.pill;
    document.getElementById('instruction').textContent = d.instruction;
    document.getElementById('content').textContent = d.content;
    document.getElementById('content').setAttribute('data-text', d.content);
    document.getElementById('slide-label').textContent = d.slideLabel;
    document.getElementById('student-callout').style.display = d.showStudent ? '' : 'none';
    document.getElementById('timer').style.display = d.showTimer ? '' : 'none';
    document.getElementById('queue-count').textContent = d.queueCount;

    document.querySelectorAll('.demo-btn').forEach(b => {
      b.classList.toggle('active', b.textContent.toLowerCase().replace(' ','') === key ||
        (key === 'sentence' && b.textContent === 'Sentence') ||
        (key === 'observe' && b.textContent === 'Observe') ||
        (key === 'complete' && b.textContent === 'Complete') ||
        (key === 'deliver' && b.textContent === 'Word'));
    });
  }

  // Start in observe mode to show the most interesting state
  setDemo('observe');
  document.querySelectorAll('.demo-btn')[2].classList.add('active');
  document.querySelectorAll('.demo-btn')[0].classList.remove('active');
</script>
</body>
</html>
