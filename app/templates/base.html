<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LUMINOS Lesson Engine{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset_url('styles.css') }}">
    {% block head %}{% endblock %}
    <script defer src="{{ asset_url('alpinejs.min.js') }}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% if current_user %}
    <header class="app-shell-nav" aria-label="Application">
        <nav class="app-shell-nav__links">
            <a href="/teach">Teach</a>
            <a href="/lesson/">Lessons</a>
            <a href="/classes/">Classes</a>
            <a href="/authoring/lessons">Authoring</a>
        </nav>
        <div class="app-shell-nav__session">
            <span class="app-shell-nav__user">{{ current_user.username }} · {{ current_user.role | title }}</span>
            <a href="/auth/logout" class="app-shell-nav__logout">Sign out</a>
        </div>
    </header>
    {% endif %}
    {% block content %}{% endblock %}
    {% block body_panels %}{% endblock %}
</body>
</html>
