<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>{{ class_name }} Board — LUMINOS</title>
  <script>
    (function() {
      const saved = window.localStorage.getItem("luminos-theme");
      const preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = saved || preferred;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#070504;
      --bg-2:#0e0a07;
      --surface:rgba(255,252,248,0.04);
      --surface-strong:rgba(255,252,248,0.06);
      --border:rgba(255,255,255,0.06);
      --text:#f0e8dd;
      --muted:rgba(240,232,221,0.52);
      --muted-strong:rgba(240,232,221,0.70);
      --accent:#c4783e;
      --accent-dim:rgba(196,120,62,0.16);
      --shadow:0 28px 80px rgba(0,0,0,0.32);
      --radius:28px;
      --radius-sm:18px;
    }
    html[data-theme="light"] {
        --bg:#f5f1eb;
        --bg-2:#ece6dd;
        --surface:rgba(255,255,255,0.68);
        --surface-strong:rgba(255,255,255,0.84);
        --border:rgba(61,43,28,0.10);
        --text:#17120e;
        --muted:rgba(23,18,14,0.54);
        --muted-strong:rgba(23,18,14,0.72);
        --accent:#b96d34;
        --accent-dim:rgba(185,109,52,0.12);
        --shadow:0 28px 72px rgba(37,24,13,0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
    }
    html[data-theme="light"] {
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:"Inter",sans-serif; }
    .board-shell { min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; }
    .board-top, .board-bottom {
      padding:18px 28px;
      border-color: var(--border);
      background: color-mix(in srgb, var(--bg) 74%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .board-top { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; border-bottom:1px solid var(--border); gap:16px; }
    .board-bottom { border-top:1px solid var(--border); display:flex; justify-content:space-between; gap:18px; color:var(--muted); }
    .board-brand { font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); justify-self:start; }
    .board-meta { font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); justify-self:center; white-space:nowrap; }
    .board-top-actions { justify-self:end; display:inline-flex; align-items:center; gap:10px; }
    .board-main {
      display:flex; align-items:center; justify-content:center; padding:48px 64px; text-align:center;
      background:
        radial-gradient(ellipse at center, color-mix(in srgb, var(--accent) 8%, transparent) 0%, transparent 58%),
        linear-gradient(180deg, color-mix(in srgb, var(--bg-2) 60%, transparent), transparent 38%);
    }
    .board-card { width:min(1200px, 100%); display:grid; gap:24px; }
    .board-content { font-family:"Cormorant Garamond",serif; font-size:clamp(80px,11vw,180px); line-height:0.96; margin:0; }
    .board-prompt { font-size:clamp(22px,2.6vw,36px); line-height:1.35; color:var(--muted-strong); }
    .board-message { font-size:clamp(22px,2.6vw,34px); line-height:1.35; color:var(--text); }
    .board-waiting { display:grid; gap:18px; }
    .board-status { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
    .board-lesson { color:var(--text); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    .board-progress { color:var(--muted); font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; }
    .board-slide-shell {
      display:grid;
      gap:20px;
      align-items:center;
      justify-items:center;
      width:100%;
      max-width:min(1320px, 100%);
    }
    .board-flashcard {
      width:min(1040px,100%);
      min-height:min(72vh,680px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--surface);
      box-shadow: var(--shadow);
      display:grid;
      place-items:center;
      padding:clamp(20px,4vw,44px);
      gap:20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .board-flashcard__image {
      width:100%;
      height:min(58vh,560px);
      max-width:100%;
      max-height:none;
      object-fit:contain;
      display:block;
      margin:0 auto;
    }
    .board-flashcard__text {
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(96px,16vw,240px);
      line-height:0.9;
      text-align:center;
    }
    .board-flashcard__blend { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
    .board-flashcard__blend-unit {
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(60px,8vw,120px);
      line-height:1;
      padding:8px 12px;
      border-bottom:2px solid rgba(255,255,255,0.18);
    }
    .board-encoding-card {
      width:min(1040px,100%);
      min-height:min(72vh,680px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--surface);
      box-shadow: var(--shadow);
      display:grid;
      place-items:center;
      padding:clamp(20px,4vw,44px);
      gap:20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .board-phoneme-card {
      width:min(1040px,100%);
      min-height:min(82vh,780px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--surface);
      box-shadow: var(--shadow);
      display:grid;
      place-items:center;
      padding:clamp(28px,5vw,64px);
      gap:20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .board-phoneme-symbol {
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(220px,32vw,460px);
      line-height:0.82;
      text-align:center;
      color:var(--text);
    }
    .board-read-card {
      width:min(1040px,100%);
      min-height:min(72vh,680px);
      border:1px solid var(--border);
      border-radius:var(--radius);
      background:var(--surface);
      box-shadow: var(--shadow);
      display:grid;
      place-items:center;
      padding:clamp(24px,4vw,48px);
      gap:24px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .board-read-card--with-image {
      align-content:center;
      justify-items:center;
    }
    .board-read-card__image {
      width:min(100%, 760px);
      max-height:min(44vh, 420px);
      object-fit:contain;
      display:block;
      margin:0 auto;
      border-radius:24px;
    }
    .board-read-card__text {
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(72px,10vw,160px);
      line-height:0.98;
      text-align:center;
      color:var(--text);
      text-wrap:balance;
    }
    .board-read-card__text--with-image {
      font-size:clamp(48px,6vw,92px);
      line-height:1.04;
    }
    .board-pattern {
      width:min(1080px,100%);
      display:grid;
      gap:22px;
      justify-items:center;
    }
    .board-pattern__grid {
      width:min(920px, 100%);
      display:grid;
      gap:18px;
    }
    .board-pattern__grid--stack {
      grid-template-columns:1fr;
      max-width:560px;
    }
    .board-pattern__grid--grid {
      grid-template-columns:repeat(2, minmax(220px, 1fr));
    }
    .board-pattern__word-card {
      min-height:120px;
      border:1px solid var(--border);
      border-radius:24px;
      background:var(--surface);
      box-shadow:var(--shadow);
      display:grid;
      place-items:center;
      padding:26px 28px;
      opacity:0;
      transform:translateY(18px);
      animation:boardPatternWordIn .42s ease forwards;
    }
    .board-pattern__word {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:6px;
      flex-wrap:wrap;
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(52px,7vw,96px);
      line-height:0.96;
      color:var(--text);
    }
    .board-pattern__segment--highlight {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:1.08em;
      padding:0.04em 0.16em 0.08em;
      border-radius:0.24em;
      background:rgba(196,120,62,0.12);
      box-shadow:inset 0 0 0 1px rgba(196,120,62,0.14);
      color:color-mix(in srgb, var(--text) 86%, #c4783e 14%);
    }
    .board-pattern__segment--pending {
      color: var(--text);
    }
    @keyframes boardPatternWordIn {
      to { opacity:1; transform:translateY(0); }
    }
    .board-encoding-boxes {
      display:flex;
      gap:clamp(10px,1.8vw,18px);
      justify-content:center;
      align-items:center;
      flex-wrap:wrap;
      width:100%;
    }
    .board-encoding-box {
      width:clamp(72px,10vw,128px);
      height:clamp(72px,10vw,128px);
      border-radius:20px;
      border:1.5px solid var(--border);
      background:color-mix(in srgb, var(--surface-strong) 72%, transparent);
      display:grid;
      place-items:center;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .board-encoding-letter {
      font-family:"Cormorant Garamond",serif;
      font-size:clamp(48px,7vw,96px);
      line-height:1;
      color:var(--text);
    }
    .theme-toggle {
      border: 1px solid var(--border);
      background: var(--surface-strong);
      color: var(--text);
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
      padding: 0 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .board-top, .board-bottom { padding: 16px 18px; }
      .board-main { padding: 36px 20px; }
      .board-card { gap: 20px; }
      .board-flashcard {
        width:min(100%,880px);
        min-height:min(64vh,540px);
        padding: 24px;
        border-radius: 22px;
      }
      .board-encoding-card {
        width:min(100%,880px);
        min-height:min(64vh,540px);
        padding:24px;
        border-radius:22px;
      }
      .board-phoneme-card {
        width:min(100%,880px);
        min-height:min(70vh,620px);
        padding:28px;
        border-radius:22px;
      }
      .board-read-card {
        width:min(100%,880px);
        min-height:min(64vh,540px);
        padding:24px;
        border-radius:22px;
      }
      .board-read-card__image {
        max-height:min(38vh, 320px);
      }
      .board-flashcard__image {
        height:min(48vh,420px);
      }
    }

    @media (max-width: 520px) {
      .board-top, .board-bottom { padding: 14px 14px; }
      .board-top { grid-template-columns: 1fr auto; grid-template-areas: "brand actions" "meta meta"; }
      .board-brand { grid-area: brand; }
      .board-top-actions { grid-area: actions; }
      .board-meta { grid-area: meta; justify-self: start; }
      .board-main { padding: 28px 16px; }
      .board-brand { font-size: 10px; }
      .board-prompt { font-size: clamp(18px, 5vw, 24px); }
      .board-flashcard {
        width:100%;
        min-height:min(58vh,420px);
        padding: 18px;
        border-radius: 18px;
      }
      .board-encoding-card {
        width:100%;
        min-height:min(58vh,420px);
        padding:18px;
        border-radius:18px;
      }
      .board-phoneme-card {
        width:100%;
        min-height:min(62vh,460px);
        padding:20px;
        border-radius:18px;
      }
      .board-read-card {
        width:100%;
        min-height:min(58vh,420px);
        padding:18px;
        border-radius:18px;
      }
      .board-read-card__image {
        max-height:min(32vh, 220px);
        border-radius:18px;
      }
      .board-read-card__text {
        font-size:clamp(54px, 14vw, 96px);
      }
      .board-read-card__text--with-image {
        font-size:clamp(36px, 9vw, 58px);
      }
      .board-phoneme-symbol { font-size: clamp(160px,44vw,300px); }
      .board-flashcard__image {
        height:min(42vh,320px);
      }
      .board-flashcard__text { font-size: clamp(84px,26vw,160px); }
      .board-flashcard__blend-unit { font-size: clamp(54px,14vw,92px); }
      .board-encoding-box {
        width:clamp(56px,16vw,88px);
        height:clamp(56px,16vw,88px);
        border-radius:16px;
      }
      .board-encoding-letter { font-size: clamp(38px,10vw,64px); }
      .theme-toggle span:last-child { display: none; }
    }

    /* drag_letter board */
    .board-drag-letter {
      display: grid;
      gap: clamp(28px, 5vw, 52px);
      align-items: center;
      justify-items: center;
      width: 100%;
    }
    .board-drag-slots,
    .board-drag-tiles {
      display: flex;
      gap: clamp(12px, 2vw, 22px);
      justify-content: center;
      flex-wrap: wrap;
    }
    .board-drag-slot {
      width: clamp(72px, 11vw, 130px);
      height: clamp(72px, 11vw, 130px);
      border: 2px solid var(--border);
      border-radius: 18px;
      background: var(--surface);
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(44px, 7vw, 90px);
      line-height: 1;
      color: var(--text);
    }
    .board-drag-slot--filled {
      border-color: var(--accent, #4a89c4);
      background: color-mix(in srgb, var(--accent, #4a89c4) 12%, transparent);
    }
    .board-drag-slot--correct {
      border-color: rgba(82, 183, 136, 0.92);
      background: rgba(216, 243, 220, 0.96);
    }
    .board-drag-slot--incorrect {
      border-color: rgba(224, 82, 82, 0.92);
      background: rgba(253, 232, 232, 0.96);
    }
    .board-drag-tile {
      width: clamp(72px, 11vw, 130px);
      height: clamp(72px, 11vw, 130px);
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(44px, 7vw, 90px);
      line-height: 1;
      color: var(--text);
    }

    .board-spell-word {
      width: min(860px, 92vw);
      display: grid;
      gap: clamp(18px, 3vw, 28px);
      justify-items: center;
    }
    .board-spell-word__letters--top,
    .board-spell-word__letters--bottom {
      display: flex;
      justify-content: center;
      gap: clamp(14px, 2.6vw, 28px);
      flex-wrap: wrap;
    }
    .board-spell-word__center {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 2.4vw, 24px);
    }
    .board-spell-word__audio {
      width: clamp(68px, 8vw, 92px);
      height: clamp(68px, 8vw, 92px);
      border-radius: 22px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, rgba(98,191,255,0.96), rgba(62,150,230,0.98));
      color: #fff;
      box-shadow: 0 16px 36px rgba(62,150,230,0.24);
    }
    .board-spell-word__audio::before {
      content: "🔊";
      font-size: clamp(28px, 3vw, 36px);
      line-height: 1;
    }
    .board-spell-word__answer-box {
      width: min(560px, 70vw);
      min-height: clamp(120px, 14vw, 156px);
      border-radius: 24px;
      border: 3px solid rgba(89, 173, 238, 0.72);
      background: rgba(255,255,255,0.92);
      box-shadow: 0 22px 48px rgba(23,16,12,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 24px;
    }
    .board-spell-word__answer-box--correct {
      border-color: rgba(82, 183, 136, 0.92);
      background: rgba(216, 243, 220, 0.96);
    }
    .board-spell-word__answer-box--incorrect {
      border-color: rgba(224, 82, 82, 0.92);
      background: rgba(253, 232, 232, 0.96);
    }
    .board-spell-word__answer {
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(54px, 7vw, 96px);
      line-height: 0.92;
      color: #17120f;
      -webkit-text-fill-color: #17120f;
      text-align: center;
    }
    .board-spell-word__tile {
      min-width: clamp(84px, 10vw, 126px);
      min-height: clamp(84px, 10vw, 126px);
      border-radius: 18px;
      border: 2px solid rgba(185,109,52,0.74);
      background: rgba(255,249,242,0.92);
      box-shadow: 0 18px 40px rgba(23,16,12,0.08);
      display: grid;
      place-items: center;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(52px, 6.6vw, 86px);
      line-height: 0.92;
      color: #17120f;
      -webkit-text-fill-color: #17120f;
    }

    @media (max-width: 520px) {
      .board-drag-slot,
      .board-drag-tile {
        width: clamp(52px, 18vw, 80px);
        height: clamp(52px, 18vw, 80px);
        border-radius: 14px;
        font-size: clamp(32px, 11vw, 56px);
      }
      .board-spell-word__audio {
        width: 60px;
        height: 60px;
        border-radius: 18px;
      }
      .board-spell-word__answer-box {
        width: min(360px, 68vw);
        min-height: 94px;
        border-radius: 18px;
      }
      .board-spell-word__tile {
        min-width: clamp(58px, 18vw, 78px);
        min-height: clamp(58px, 18vw, 78px);
        border-radius: 14px;
        font-size: clamp(34px, 10vw, 54px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="board-shell" id="board-shell">
    <header class="board-top">
      <div class="board-brand">LUMINOS</div>
      <div id="board-meta" class="board-meta">{{ class_name }}</div>
      <div class="board-top-actions">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme"><span>◐</span><span>&nbsp;Theme</span></button>
        <div id="board-status" class="board-status">Connecting</div>
      </div>
    </header>
    <main class="board-main">
      <div class="board-card" id="board-card">
        <div class="board-waiting">
          <div class="board-eyebrow">{{ class_name }}</div>
          <h1 class="board-title">Waiting for teacher to start a lesson</h1>
          <div class="board-prompt">This display renders directly from the server session state.</div>
        </div>
      </div>
    </main>
    <footer class="board-bottom">
      <div id="board-lesson" class="board-lesson">{{ class_name }}</div>
      <div id="board-progress" class="board-progress"></div>
    </footer>
  </div>
  <script>
    (function() {
      const classId = {{ class_id | tojson }};
      const root = document.documentElement;
      const themeToggle = document.getElementById("theme-toggle");
      const statusEl = document.getElementById("board-status");
      const cardEl = document.getElementById("board-card");
      const lessonEl = document.getElementById("board-lesson");
      const progressEl = document.getElementById("board-progress");
      const metaEl = document.getElementById("board-meta");
      let lastRenderKey = "";

      if (themeToggle) {
        themeToggle.addEventListener("click", function() {
          const next = root.dataset.theme === "dark" ? "light" : "dark";
          root.dataset.theme = next;
          window.localStorage.setItem("luminos-theme", next);
        });
      }

	      function render(data) {
        statusEl.textContent = data.paused ? "Paused" : (data.active ? "Live" : "Waiting");
        lessonEl.textContent = data.slide_title || data.lesson_title || {{ class_name | tojson }};
        progressEl.textContent = data.active ? `Slide ${data.slide_index + 1} / ${data.slide_count}` : "";
        metaEl.textContent = data.active ? `${data.lesson_id || ""} · Block ${String(data.block_id || "")}` : {{ class_name | tojson }};
        if (!data.active) {
          cardEl.innerHTML = `
            <div class="board-waiting">
              <div class="board-content" style="font-size:clamp(44px,7vw,84px);">${escapeHtml(data.class_name)}</div>
              <div class="board-prompt">This display renders directly from the server session state.</div>
            </div>`;
          return;
        }
	        const message = data.display_message ? `<div class="board-message">${escapeHtml(data.display_message)}</div>` : "";
          if (data.view_type === "flashcard") {
            cardEl.innerHTML = renderFlashcard(data, message);
            return;
          }
          if (data.view_type === "phonemes") {
            cardEl.innerHTML = renderPhoneme(data, message);
            return;
          }
          if (data.view_type === "spell_word") {
            cardEl.innerHTML = renderSpellWord(data, message);
            return;
          }
          if (data.view_type === "pattern_noticing") {
            cardEl.innerHTML = renderPatternNoticing(data, message);
            return;
          }
          if (data.view_type === "read_respond") {
            cardEl.innerHTML = renderReadRespond(data, message);
            return;
          }
          if (data.view_type === "writing_encoding" && String(data.block_id || "") === "02") {
            cardEl.innerHTML = renderListeningEncoding(data, message);
            return;
          }
          if (data.view_type === "drag_letter") {
            cardEl.innerHTML = renderDragLetter(data, message);
            return;
          }
	        cardEl.innerHTML = `
	          <div class="board-content">${escapeHtml(data.content || "")}</div>
	          ${data.prompt ? `<div class="board-prompt">${escapeHtml(data.prompt || "")}</div>` : ""}
	          ${message}
	        `;
	      }

        function renderFlashcard(data, message) {
          const payload = data.payload || {};
          const revealed = !!data.revealed;
          const legacyImage = payload.image && !payload.front_image && !payload.back_image ? payload.image : "";
          const frontImage = payload.front_image || (!payload.front_text ? legacyImage : "") || "";
          const backImage = payload.back_image || (payload.front_text && !payload.back_text ? legacyImage : "") || "";
          const frontText = payload.front_text || "";
          const backText = payload.back_text || frontText || "";
          const blendUnits = Array.isArray(payload.blend_units) ? payload.blend_units : [];
          let body = "";
          if (!revealed) {
            if (frontImage) {
              body += `<img class="board-flashcard__image" src="${escapeHtml(frontImage)}" alt="${escapeHtml(data.slide_title || "Flashcard")}">`;
            }
            if (frontText) {
              body += `<div class="board-flashcard__text">${escapeHtml(frontText)}</div>`;
            }
          } else if (blendUnits.length) {
            body += `<div class="board-flashcard__blend">${blendUnits.map((unit) => `<span class="board-flashcard__blend-unit">${escapeHtml(unit.grapheme || "")}</span>`).join("")}</div>`;
          } else {
            if (backImage) {
              body += `<img class="board-flashcard__image" src="${escapeHtml(backImage)}" alt="${escapeHtml((data.slide_title || "Flashcard") + " answer")}">`;
            }
            if (backText) {
              body += `<div class="board-flashcard__text">${escapeHtml(backText)}</div>`;
            }
          }
          return `
            <div class="board-slide-shell">
              <div class="board-flashcard">${body}</div>
              ${data.prompt ? `<div class="board-prompt">${escapeHtml(data.prompt || "")}</div>` : ""}
              ${message}
            </div>
          `;
        }

        function renderListeningEncoding(data, message) {
          const payload = data.payload || {};
          const answerText = String(payload.expected_answer || "").replace(/\s+/g, "");
          const chars = Array.from(answerText);
          const boxCount = Number(payload.elkonin_boxes) || chars.length || 1;
          const revealed = !!data.revealed;
          const boxes = Array.from({ length: boxCount }, function(_, index) {
            const letter = revealed && index < chars.length ? `<span class="board-encoding-letter">${escapeHtml(chars[index])}</span>` : "";
            return `<div class="board-encoding-box">${letter}</div>`;
          }).join("");
          return `
            <div class="board-slide-shell">
              <div class="board-encoding-card">
                <div class="board-encoding-boxes">${boxes}</div>
              </div>
              ${message}
            </div>
          `;
        }

        function renderPhoneme(data, message) {
          const payload = data.payload || {};
          const symbol = payload.symbol || data.content || "";
          return `
            <div class="board-slide-shell">
              <div class="board-phoneme-card">
                <div class="board-phoneme-symbol">${escapeHtml(symbol)}</div>
              </div>
              ${data.prompt ? `<div class="board-prompt">${escapeHtml(data.prompt || "")}</div>` : ""}
              ${message}
            </div>
          `;
        }

        function renderSpellWord(data, message) {
          const payload = data.payload || {};
          const answer = String(payload.correct_word || data.content || "").trim();
          const selectedLetters = Array.isArray(data.spell_word_selection) ? data.spell_word_selection : [];
          const normalizedAnswer = answer.replace(/\s+/g, "").toLowerCase();
          const selectedWord = selectedLetters.join("").replace(/\s+/g, "").toLowerCase();
          const isComplete = selectedLetters.length > 0 && selectedLetters.length === answer.replace(/\s+/g, "").length;
          const isCorrect = isComplete && selectedWord === normalizedAnswer;
          const letters = stableShuffle(
            Array.isArray(payload.letter_pool) ? payload.letter_pool : [],
            `${data.slide_id || ""}:spell_word_tiles`
          );
          const midpoint = Math.ceil(letters.length / 2);
          const topLetters = letters.slice(0, midpoint);
          const bottomLetters = letters.slice(midpoint);
          const topHtml = topLetters.map((item) => `<div class="board-spell-word__tile">${escapeHtml(item)}</div>`).join("");
          const bottomHtml = bottomLetters.map((item) => `<div class="board-spell-word__tile">${escapeHtml(item)}</div>`).join("");
          return `
            <div class="board-slide-shell">
              <div class="board-spell-word">
                <div class="board-spell-word__letters--top">${topHtml}</div>
                <div class="board-spell-word__center">
                  ${data.audio_url ? `<div class="board-spell-word__audio" aria-hidden="true"></div>` : ""}
                  <div class="board-spell-word__answer-box ${!data.revealed && isComplete ? (isCorrect ? "board-spell-word__answer-box--correct" : "board-spell-word__answer-box--incorrect") : ""}">
                    ${data.revealed
                      ? `<div class="board-spell-word__answer">${escapeHtml(answer)}</div>`
                      : (selectedLetters.length
                        ? `<div class="board-spell-word__answer">${escapeHtml(selectedLetters.join(""))}</div>`
                        : "")}
                  </div>
                </div>
                ${bottomHtml ? `<div class="board-spell-word__letters--bottom">${bottomHtml}</div>` : ""}
              </div>
              ${message}
            </div>
          `;
        }

        function renderPatternNoticing(data, message) {
          const payload = data.payload || {};
          const words = Array.isArray(payload.words) ? payload.words : [];
          const revealMode = String(payload.reveal_mode || "sequential");
          const maxReveal = words.length;
          const revealCount = revealMode === "all_at_once"
            ? (Number(data.pattern_noticing_reveal_count || 0) > 0 ? maxReveal : 0)
            : Math.max(0, Math.min(Number(data.pattern_noticing_reveal_count || 0), maxReveal));
          const gridClass = words.length <= 2 ? "board-pattern__grid--stack" : "board-pattern__grid--grid";
          const wordsHtml = words.map((word, index) => {
            const revealed = index < revealCount;
            const segments = Array.isArray(word?.segments) ? word.segments : [];
            const content = segments.map((segment) => {
              const text = escapeHtml(String(segment?.text || ""));
              const className = segment?.highlight
                ? (revealed ? "board-pattern__segment--highlight" : "board-pattern__segment--pending")
                : "";
              return `<span class="${className}">${text}</span>`;
            }).join("");
            return `<div class="board-pattern__word-card" ${revealed ? `style="animation-delay:${index * 80}ms"` : ""}><div class="board-pattern__word">${content}</div></div>`;
          }).join("");
          return `
            <div class="board-slide-shell">
              <div class="board-pattern">
                <div class="board-pattern__grid ${gridClass}">${wordsHtml}</div>
              </div>
              ${message}
            </div>
          `;
        }

        function renderReadRespond(data, message) {
          const payload = data.payload || {};
          const image = String(payload.image || "").trim();
          const text = String(payload.text_content || data.content || "").trim();
          if (!image) {
            return `
              <div class="board-slide-shell">
                <div class="board-read-card">
                  <div class="board-read-card__text">${escapeHtml(text)}</div>
                </div>
                ${message}
              </div>
            `;
          }
          return `
            <div class="board-slide-shell">
              <div class="board-read-card board-read-card--with-image">
                <img class="board-read-card__image" src="${escapeHtml(image)}" alt="${escapeHtml(data.slide_title || "Read & Respond")}">
                <div class="board-read-card__text board-read-card__text--with-image">${escapeHtml(text)}</div>
              </div>
              ${message}
            </div>
          `;
        }

        function renderDragLetter(data, message) {
          const payload = data.payload || {};
          const slots = Array.isArray(payload.slots) && payload.slots.length
            ? payload.slots
            : (Array.isArray(payload.target_letters) ? payload.target_letters : []);
          const letters = stableShuffle(
            Array.isArray(payload.draggable_letters) ? payload.draggable_letters : [],
            `${data.slide_id || ""}:drag_letter_tiles`
          );
          if (!slots.length && !letters.length) {
            return `
              <div class="board-content">${escapeHtml(data.content || "")}</div>
              ${data.prompt ? `<div class="board-prompt">${escapeHtml(data.prompt || "")}</div>` : ""}
              ${message}
            `;
          }
          const revealCount = typeof data.letter_reveal_count === "number" ? data.letter_reveal_count : 0;
          const dragSelection = Array.isArray(data.drag_letter_selection) ? data.drag_letter_selection : [];
          const normalizedTarget = slots.join("").toLowerCase();
          const normalizedSelected = dragSelection.filter(Boolean).join("").toLowerCase();
          const selectionComplete = dragSelection.filter(Boolean).length > 0 && dragSelection.filter(Boolean).length === slots.length;
          const selectionCorrect = selectionComplete && normalizedSelected === normalizedTarget;
          const slotsHtml = slots.map((letter, i) => {
            const selected = dragSelection[i];
            if (selected) {
              return `<div class="board-drag-slot board-drag-slot--filled ${selectionComplete ? (selectionCorrect ? "board-drag-slot--correct" : "board-drag-slot--incorrect") : ""}">${escapeHtml(selected)}</div>`;
            }
            if (i < revealCount) {
              return `<div class="board-drag-slot board-drag-slot--filled">${escapeHtml(letter)}</div>`;
            }
            return `<div class="board-drag-slot"></div>`;
          }).join("");
          const remainingLetters = [...letters];
          dragSelection.forEach((selected) => {
            if (!selected) return;
            const idx = remainingLetters.indexOf(selected);
            if (idx !== -1) remainingLetters.splice(idx, 1);
          });
          const tilesHtml = remainingLetters.map(l => `<div class="board-drag-tile">${escapeHtml(l)}</div>`).join("");
          return `
            <div class="board-slide-shell">
              <div class="board-drag-letter">
                <div class="board-drag-slots">${slotsHtml}</div>
                <div class="board-drag-tiles">${tilesHtml}</div>
              </div>
              ${message}
            </div>
          `;
        }

      function stableShuffle(items, seedSource) {
        const list = Array.isArray(items) ? [...items] : [];
        if (list.length <= 1) return list;
        let seed = 0;
        const source = String(seedSource || "");
        for (let i = 0; i < source.length; i += 1) {
          seed = ((seed * 31) + source.charCodeAt(i)) >>> 0;
        }
        const next = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = list.length - 1; i > 0; i -= 1) {
          const j = Math.floor(next() * (i + 1));
          [list[i], list[j]] = [list[j], list[i]];
        }
        return list;
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[ch]));
      }

      async function poll() {
        try {
          const response = await fetch(`/classes/${classId}/session-state?ts=${Date.now()}`, { cache: "no-store" });
          if (response.ok) {
            const data = await response.json();
            const renderKey = JSON.stringify({
              active: data.active,
              status: data.status,
              paused: data.paused,
              version: data.version,
              slide_id: data.slide_id,
              view_type: data.view_type,
              revealed: data.revealed,
              letter_reveal_count: data.letter_reveal_count,
              drag_letter_selection: data.drag_letter_selection,
              spell_word_selection: data.spell_word_selection,
              pattern_noticing_reveal_count: data.pattern_noticing_reveal_count,
              display_message: data.display_message,
            });
            if (renderKey !== lastRenderKey) {
              lastRenderKey = renderKey;
              render(data);
            }
          }
        } catch (_) {}
        window.setTimeout(poll, 900);
      }

      poll();
    })();
  </script>
</body>
</html>
