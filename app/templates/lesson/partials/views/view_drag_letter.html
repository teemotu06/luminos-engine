<div
  class="lesson-drag-letter"
  x-data='dragBuild({{ (slide.content_payload.slots or slide.content_payload.target_letters) | tojson }})'
  @lesson-nav-reveal.window="if ($event.detail.slideIndex === {{ slide_index }}) reveal()"
>
  {% set slot_units = slide.content_payload.slots or slide.content_payload.target_letters %}
  <div class="lesson-drag-letter__board">
    <div class="lesson-drag-letter__target-row">
      <div class="lesson-drag-letter__slots" aria-label="Word slots">
        {% for idx in range(slot_units | length) %}
          <template x-if="placedItems[{{ idx }}] !== undefined">
            <button
              type="button"
              class="lesson-drag-letter__slot lesson-drag-letter__slot--filled"
              :class="checked ? (isCorrect() ? 'lesson-drag-letter__slot--correct' : 'lesson-drag-letter__slot--incorrect') : ''"
              @click="removeItem({{ idx }})"
              :style="getResponsiveTextStyle(placedItems[{{ idx }}], 'letter-card')"
              x-text="placedItems[{{ idx }}]">
            </button>
          </template>

          <template x-if="placedItems[{{ idx }}] === undefined">
            <div class="lesson-drag-letter__slot lesson-drag-letter__slot--empty"></div>
          </template>
        {% endfor %}
      </div>
    </div>

    <div class="lesson-drag-letter__cards">
      {% for letter in slide.content_payload.draggable_letters %}
      <button
        type="button"
        class="lesson-drag-letter__card"
        :style='getResponsiveTextStyle({{ letter | tojson }}, "letter-card")'
        @click="placeItem('{{ letter }}')">
        {{ letter }}
      </button>
      {% endfor %}
    </div>
  </div>

  <div class="lesson-drag-letter__actions">
    <button
      type="button"
      class="lesson-drag-letter__button"
      @click="check()"
      :disabled="placedItems.length !== {{ slot_units | length }}">
      Check
    </button>

    <button
      type="button"
      class="lesson-drag-letter__button"
      @click="reset()">
      Reset
    </button>

  </div>

  <div
    class="lesson-drag-letter__feedback"
    x-show="checked"
    :class="isCorrect() ? 'lesson-drag-letter__feedback--correct' : 'lesson-drag-letter__feedback--incorrect'">
    <span x-show="isCorrect()">Built correctly</span>
    <span x-show="!isCorrect()">Check the build and try again</span>
  </div>
</div>
