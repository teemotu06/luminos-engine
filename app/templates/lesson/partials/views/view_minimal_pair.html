<div class="lesson-minimal-pair">
  {% if slide.content_payload.korean_flag %}
  <div class="lesson-minimal-pair__flag">
    <div class="lesson-minimal-pair__flag-label">Korean interference flag</div>
    <div class="lesson-minimal-pair__flag-value">
      {{ slide.content_payload.korean_flag }}
    </div>
    <div class="lesson-minimal-pair__correction">
      {{ slide.content_payload.correction_routine }}
    </div>
  </div>
  {% endif %}

  <div class="lesson-minimal-pair__choices">
    <button
      type="button"
      class="lesson-minimal-pair__choice"
      @click="playAudio('{{ slide.content_payload.pair_A.audio }}')">
      <span
        class="lesson-minimal-pair__choice-label"
        :style='getResponsiveTextStyle({{ slide.content_payload.pair_A.label | tojson }}, "choice")'>
        {{ slide.content_payload.pair_A.label }}
      </span>
      <span class="lesson-minimal-pair__choice-audio">Play A</span>
    </button>

    <button
      type="button"
      class="lesson-minimal-pair__choice"
      @click="playAudio('{{ slide.content_payload.pair_B.audio }}')">
      <span
        class="lesson-minimal-pair__choice-label"
        :style='getResponsiveTextStyle({{ slide.content_payload.pair_B.label | tojson }}, "choice")'>
        {{ slide.content_payload.pair_B.label }}
      </span>
      <span class="lesson-minimal-pair__choice-audio">Play B</span>
    </button>
  </div>

  <div class="lesson-minimal-pair__answer">
    Correct choice: {{ slide.content_payload.correct_choice }}
  </div>

  <div class="lesson-minimal-pair__marking">
    <button
      type="button"
      class="lesson-minimal-pair__mark-button"
      :class="{ 'lesson-minimal-pair__mark-button--active': slideMarks[{{ slide_index }}]?.status === 'secure' }"
      @click="setAndSubmitSlideMark({{ slide_index }}, 'secure', '{{ slide.slide_id }}', '{{ slide.block_id }}')">
      Correct
    </button>

    <button
      type="button"
      class="lesson-minimal-pair__mark-button"
      :class="{ 'lesson-minimal-pair__mark-button--active': slideMarks[{{ slide_index }}]?.status === 'missed' }"
      @click="setAndSubmitSlideMark({{ slide_index }}, 'missed', '{{ slide.slide_id }}', '{{ slide.block_id }}')">
      Incorrect
    </button>
  </div>
</div>
