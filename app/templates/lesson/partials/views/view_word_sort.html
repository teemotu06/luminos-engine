<div class="lesson-quick-check">
  <p class="lesson-audio-prompt__prompt">{{ slide.content_payload.instruction_text }}</p>
  <div style="display:grid; gap:12px;">
    {% for category in slide.content_payload.categories %}
    <div style="border:1px solid #ddd; border-radius:10px; padding:12px; background:#fff;">
      <div style="font-weight:700; margin-bottom:8px;">{{ category.category_label }}</div>
      <div>{{ category.words | join(", ") if category.words else "No words yet" }}</div>
    </div>
    {% endfor %}
  </div>
</div>
