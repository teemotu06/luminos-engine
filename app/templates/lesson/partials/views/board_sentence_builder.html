<div class="lesson-drag-word">
  {% if slide.content_payload.image_url %}
  <div class="lesson-audio-prompt__image-wrap" style="margin-bottom:12px;">
    <img class="lesson-audio-prompt__image" src="{{ slide.content_payload.image_url }}" alt="{{ slide.slide_title }}">
  </div>
  {% endif %}
  <div style="padding:16px; border:1px dashed #bbb; border-radius:10px; min-height:80px; background:#fafafa; margin-bottom:16px;">
    Build the sentence here
  </div>
  <div style="display:flex; flex-wrap:wrap; gap:8px;">
    {% for tile in slide.content_payload.word_tiles %}
    <div style="padding:10px 14px; border:1px solid #ddd; border-radius:10px; background:#fff;">{{ tile }}</div>
    {% endfor %}
  </div>
</div>
