<div class="lesson-block-body">
    {% if slide.text %}
        <p class="slide-note">{{ slide.text }}</p>
    {% endif %}

    {% if slide.prompt %}
        <p class="slide-note"><strong>{{ slide.prompt }}</strong></p>
    {% endif %}

    {% if slide.teacher_note %}
        <p class="slide-note">{{ slide.teacher_note }}</p>
    {% endif %}
</div>
