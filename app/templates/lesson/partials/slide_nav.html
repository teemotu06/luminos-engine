{% if ordered_slides %}
<nav class="lesson-nav" aria-label="Lesson slide navigation">

    <button
        id="lesson-prev-link"
        type="button"
        class="lesson-nav__button"
        @click="goToPrevSlide()"
        :disabled="activeSlideIndex === 0">
        <span class="lesson-nav__arrow">←</span> Previous
    </button>

    <span class="lesson-nav__status">
        <span x-text="`${activeSlideIndex + 1} / {{ ordered_slides|length }}`"></span>
    </span>

    <template x-if="activeSlideIndex < {{ ordered_slides|length - 1 }}">
      <button
          id="lesson-next-link"
          type="button"
          class="lesson-nav__button"
          @click="goToNextSlide()">
          Next <span class="lesson-nav__arrow">→</span>
      </button>
    </template>
    <template x-if="activeSlideIndex >= {{ ordered_slides|length - 1 }}">
      <a
          id="lesson-finish-link"
          class="lesson-nav__button lesson-nav__button--finish"
          :href="`/lesson/{{ lesson.lesson_id }}/review/${attemptId}`"
          @click.prevent="finishLesson()">
          Finish &amp; review <span class="lesson-nav__arrow">→</span>
      </a>
    </template>

</nav>
{% endif %}
