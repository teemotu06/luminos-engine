{% if ordered_slides %}
<nav class="lesson-nav" aria-label="Lesson slide navigation">

    <button
        id="lesson-prev-link"
        type="button"
        class="lesson-nav__button"
        @click="goToPrevSlide()"
        :disabled="activeSlideIndex === 0">
        Previous
    </button>

    <span class="lesson-nav__status">
        <span x-text="`Slide ${activeSlideIndex + 1} of {{ ordered_slides|length }}`"></span>
    </span>

    <button
        id="lesson-next-link"
        type="button"
        class="lesson-nav__button"
        @click="goToNextSlide()"
        :disabled="activeSlideIndex >= {{ ordered_slides|length - 1 }}">
        Next
    </button>

</nav>
{% endif %}
