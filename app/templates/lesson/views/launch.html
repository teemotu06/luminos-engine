<section class="card slide-card">
    <p class="slide-meta">Block {{ slide.block }} · {{ slide.view_type }}</p>
    <h2 class="slide-title">{{ slide.title }}</h2>

    {% if slide.text %}
        <p class="slide-note">{{ slide.text }}</p>
    {% endif %}

    {% if slide.teacher_note %}
        <p class="slide-note">{{ slide.teacher_note }}</p>
    {% endif %}
</section>
